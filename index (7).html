<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4a2b1c">
<meta name="description" content="Connect with Silai Ghar PK on social media. Fashion for every occasion.">
<title>Silai Ghar PK | Connect With Us</title>
<style>
  :root {
    --cream: #fbf4ec;
    --cream2: #fffaf4;
    --brown: #4b2c1d;
    --gold: #b38a5a;
    --ink: #21140e;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    background:
      radial-gradient(ellipse at 50% 16%, rgba(255,255,255,.98) 0%, rgba(255,250,244,.94) 38%, rgba(243,224,207,.78) 100%),
      var(--cream);
    min-height: 100vh;
  }
  .page {
    width: min(100%, 1024px);
    min-height: 100vh;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    padding: clamp(24px, 5vw, 54px) clamp(18px, 6vw, 62px) 0;
    isolation: isolate;
  }
  .page::before, .page::after {
    content: "";
    position: absolute;
    z-index: -1;
    pointer-events: none;
    opacity: .38;
  }
  .page::before {
    width: 210px; height: 360px; left: -95px; top: 90px;
    border-radius: 50%;
    background: repeating-linear-gradient(145deg, transparent 0 24px, #d9a88d 25px 27px, transparent 28px 49px);
    transform: rotate(25deg);
    mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
  }
  .page::after {
    width: 180px; height: 300px; right: -100px; top: 55px;
    border-radius: 50%;
    background: repeating-linear-gradient(35deg, transparent 0 23px, #c4a17b 24px 26px, transparent 27px 48px);
    transform: rotate(-20deg);
    mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
  }
  .brand { text-align: center; }
  .logo {
    display: block;
    width: min(86%, 560px);
    height: auto;
    max-height: 190px;
    object-fit: contain;
    margin: 0 auto 8px;
  }
  .brand-name {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(38px, 7.8vw, 76px);
    line-height: 1;
    letter-spacing: -.045em;
    font-weight: 500;
    color: #090807;
  }
  .brand-name span { color: #79532c; }
  .rule { width: min(78%, 500px); height: 1px; margin: 16px auto 10px; background: linear-gradient(90deg, transparent, #b79a7a, transparent); }
  .tagline {
    margin: 0;
    color: #68442a;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: clamp(20px, 3.6vw, 34px);
  }
  .categories {
    margin: 25px 0 0;
    display: flex; justify-content: center; align-items: center;
    flex-wrap: wrap; gap: 10px 22px;
    font-size: clamp(10px, 1.5vw, 14px);
    letter-spacing: .22em;
  }
  .categories span + span::before { content: "|"; margin-right: 22px; color: #866849; }
  .connect-title {
    display: flex; align-items: center; justify-content: center; gap: 24px;
    margin: clamp(48px, 7vw, 78px) 0 28px;
    color: #3f2416; font-size: clamp(18px, 3.1vw, 31px);
    letter-spacing: .24em; font-weight: 600; text-align: center;
  }
  .connect-title::before, .connect-title::after {
    content: ""; height: 1px; width: min(16%, 140px); background: #b78a5b; flex: 1 1 50px;
  }
  .social-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px 22px;
  }
  .social-card {
    --accent: #d8bfa4;
    min-height: 112px;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
    color: #111;
    text-decoration: none;
    border: 1.5px solid var(--accent);
    border-radius: 34px;
    background: rgba(255,255,255,.63);
    box-shadow: 0 0 0 3px rgba(255,255,255,.7) inset, 0 7px 22px rgba(87,51,29,.06);
    transition: transform .2s ease, box-shadow .2s ease;
    min-width: 0;
  }
  .social-card:hover, .social-card:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 9px 25px rgba(87,51,29,.14), 0 0 0 3px rgba(255,255,255,.7) inset;
    outline: none;
  }
  .social-icon {
    width: 68px; height: 68px; flex: 0 0 68px;
    display: grid; place-items: center;
    border-radius: 50%; color: #fff; font-size: 36px; font-weight: 700;
    overflow: hidden;
  }
  .social-icon svg { width: 42px; height: 42px; fill: currentColor; }
  .social-label { font-size: clamp(14px, 2vw, 20px); line-height: 1.2; flex: 1; }
  .arrow { font-size: 27px; font-weight: 300; margin-left: auto; }
  .pinterest { --accent:#ff8f8f; }
  .pinterest .social-icon { background:#bd081c; }
  .google { --accent:#e9d8c3; }
  .google .social-icon { background:#fff; }
  .google .social-icon svg { width: 56px; height: 56px; }
  .tiktok { --accent:#8ce9f0; }
  .tiktok .social-icon { background:#090909; }
  .instagram { --accent:#f38ad6; }
  .instagram .social-icon { background: radial-gradient(circle at 30% 105%, #ffdc80 0 16%, #fcaf45 22%, #f65b37 42%, #d62976 62%, #962fbf 80%, #4f5bd5 100%); }
  .facebook { --accent:#66aaff; }
  .facebook .social-icon { background:#1877f2; }
  .youtube { --accent:#ff8585; }
  .youtube .social-icon { background:#ff0000; }
  .whatsapp { --accent:#72d9a1; }
  .whatsapp .social-icon { background:#25d366; }
  .website {
    display: flex; align-items: center; justify-content: center; gap: 24px;
    margin: 44px auto 0; padding: 22px 28px;
    width: min(100%, 750px); min-height: 145px;
    color: white; text-decoration: none; text-align: center;
    border: 2px solid #f3d49d; border-radius: 100px;
    background: linear-gradient(135deg, #573522, #321b10);
    box-shadow: 0 0 0 4px rgba(255,255,255,.6), 0 8px 30px rgba(97,57,29,.25);
    transition: transform .2s ease;
  }
  .website:hover { transform: translateY(-3px); }
  .globe { width: 46px; height: 46px; flex: 0 0 46px; display: grid; place-items: center; }
  .globe svg { width: 100%; height: 100%; }
  .website-copy { flex: 1; text-align: center; }
  .divider { width: 1px; height: 64px; background: #e9d4b8; }
  .website small { display: block; font-size: clamp(10px, 1.6vw, 16px); letter-spacing: .25em; margin-bottom: 8px; }
  .website strong { display: block; font-size: clamp(18px, 3.4vw, 34px); letter-spacing: .13em; overflow-wrap: anywhere; }
  .website .arrow { font-size: 38px; }
  .slogan {
    text-align: center; margin: 60px 0 28px; color: #68442e;
    font-family: "Brush Script MT", "Segoe Script", cursive;
    font-style: italic; font-size: clamp(28px, 5vw, 47px);
  }
  .heart-rule { display: flex; align-items: center; justify-content: center; gap: 18px; color: #866548; font-size: 29px; margin-bottom: 30px; }
  .heart-rule::before, .heart-rule::after { content:""; width: 140px; max-width: 27%; height: 1px; background: #b9a087; }
  footer {
    position: relative; margin: 0 calc(clamp(18px, 6vw, 62px) * -1);
    padding: 50px 18px 34px; color: #fff7ed; text-align: center;
    background: #4b2c1d;
    border-radius: 48% 48% 0 0 / 14% 14% 0 0;
  }
  footer .footer-script { font-family: "Brush Script MT", "Segoe Script", cursive; font-size: clamp(23px, 3.4vw, 32px); font-style: italic; }
  footer .footer-heart { margin-top: 6px; color: #f2d9b9; }
  @media (max-width: 700px) {
    .page { padding-left: 16px; padding-right: 16px; }
    .logo { width: min(70%, 320px); max-height: 130px; }
    .categories { gap: 9px 12px; letter-spacing: .12em; }
    .categories span + span::before { margin-right: 12px; }
    .connect-title { gap: 12px; letter-spacing: .13em; margin-top: 46px; }
    .social-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .social-card { min-height: 84px; border-radius: 25px; padding: 8px 6px; gap: 6px; flex-direction: column; justify-content: center; text-align: center; }
    .social-icon { width: 42px; height: 42px; flex-basis: 42px; font-size: 24px; }
    .social-icon svg { width: 26px; height: 26px; }
    .google .social-icon svg { width: 36px; height: 36px; }
    .social-label { font-size: clamp(10px, 2.5vw, 16px); }
    .arrow { font-size: 18px; margin-left: 0; }
    .website { gap: 13px; padding: 19px 15px; min-height: 105px; margin-top: 30px; }
    .globe { width: 32px; height: 32px; flex-basis: 32px; }
    .divider { height: 48px; }
    .website strong { letter-spacing: .07em; }
    .website .arrow { font-size: 28px; }
    .slogan { margin-top: 42px; }
    footer { margin-left: -16px; margin-right: -16px; }
  }
  @media (max-width: 390px) {
    .social-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .social-card { min-height: 76px; padding: 10px 16px; }
    .social-icon { width: 48px; height: 48px; flex-basis: 48px; }
    .website { border-radius: 35px; }
    .website small { letter-spacing: .12em; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
